<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventiv DataViz – Local test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f5f5f5; }
    .header {
      padding: 12px 16px;
      background: #323232;
      color: #fff;
      font-size: 14px;
    }
    .header a { color: #7ed321; }
    #visual {
      width: 100%;
      height: calc(100vh - 44px);
      min-height: 400px;
      background: #fff;
    }
    #error { padding: 16px; color: #c00; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <strong>Inventiv DataViz</strong> – Local test · Legal Entities Graph – click a node to explore. 
    Run <code>npm run build:test</code> once, then <code>npm run test:local</code>. No dev server needed.
  </div>
  <div id="visual"></div>
  <div id="error"></div>

  <script>
    (function() {
      // Minimal Power BI host mock so the visual plugin can register
      window.powerbi = window.powerbi || {};
      window.powerbi.visuals = window.powerbi.visuals || {};
      window.powerbi.visuals.plugins = window.powerbi.visuals.plugins || {};

      var script = document.createElement('script');
      // Relative URL works when served (localhost:3000) and when opened as file (file://.../test/index.html)
      script.src = 'dist/visual.js';
      script.async = false;
      script.onload = function() {
        // Plugin: inventivLegalEntitiesGraph (debug or prod)
        var plugin = window.inventivLegalEntitiesGraph_DEBUG || window.inventivLegalEntitiesGraph;
        if (!plugin || typeof plugin.create !== 'function') {
          showError('Inventiv DataViz plugin not found. Run: npm run build:test');
          return;
        }
        var el = document.getElementById('visual');
        try {
          var visual = plugin.create({ element: el });
          if (visual && typeof visual.update === 'function') {
            visual.update({ dataViews: [] });
          }
        } catch (e) {
          showError('Failed to create visual: ' + e.message);
        }
      };
      script.onerror = function() {
        showError('Could not load visual.js. Use: npm run test:local (it will build if needed, then open http://localhost:3000)');
      };
      document.head.appendChild(script);

      function showError(msg) {
        var el = document.getElementById('error');
        el.textContent = msg;
        el.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
