<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventiv DataViz – Hello World (Legal Entities)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    h1 { font-size: 1.25rem; }
    #graph { width: 100%; height: 400px; border: 1px solid #eee; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Hello World – Legal Entities Graph</h1>
  <p>Same pattern: one script, one container, one call. Click a node to expand.</p>
  <div id="graph"></div>

  <script src="../dist/inventiv-dataviz.js"></script>
  <script>
    // Data: nodes (id, label, type) and links (source, target, shares)
    var data = {
      nodes: [
        { id: "1", label: "Parent Co", type: "Entity" },
        { id: "2", label: "Subsidiary A", type: "Entity" },
        { id: "3", label: "Alice", type: "Shareholder" },
        { id: "4", label: "Bob", type: "Shareholder" }
      ],
      links: [
        { source: "3", target: "1", shares: 500 },
        { source: "4", target: "1", shares: 500 },
        { source: "1", target: "2", shares: 1000 }
      ]
    };

    var container = document.getElementById("graph");
    InventivDataviz.createLegalEntitiesGraph(container, data);
  </script>
</body>
</html>
